name: Blanc Client mod
on:
  workflow_dispatch:
  push:
    branches: [feature/server-hosting]
    paths: ['blanc-mod/**', '.github/workflows/blanc-mod.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Resolve latest Fabric versions for Minecraft 1.21.11
        working-directory: blanc-mod
        run: |
          MC=1.21.11
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | python3 -c "import json,sys; print([x['version'] for x in json.load(sys.stdin) if x['stable']][0])")
          API=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | tail -1)
          LOOM=$(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<release>[^<]*' | sed 's/<release>//')
          echo "mc=$MC loader=$LOADER api=$API loom=$LOOM"
          sed -i "s/^minecraft_version=.*/minecraft_version=$MC/; s/^loader_version=.*/loader_version=$LOADER/; s/^fabric_version=.*/fabric_version=$API/; s/^loom_version=.*/loom_version=$LOOM/" gradle.properties
          cat gradle.properties
      - name: Build
        working-directory: blanc-mod
        run: |
          gradle build --no-daemon > /tmp/mod.log 2>&1 || { grep -E "What went wrong" -A14 /tmp/mod.log | head -50; grep -E "error:|warning: \[" -A2 /tmp/mod.log | head -40; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: blanc-client-mod
          path: blanc-mod/build/libs/blanc-client-*.jar
      - name: Publish release asset
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          JAR=$(ls blanc-mod/build/libs/blanc-client-*[0-9].jar | head -1)
          gh release view blanc-mod >/dev/null 2>&1 || gh release create blanc-mod --title "Blanc Client mod" --notes "Latest Blanc Client for Minecraft 1.21.11" --target "$GITHUB_SHA"
          cp "$JAR" blanc-client.jar
          gh release upload blanc-mod blanc-client.jar --clobber
